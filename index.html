<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Queso You're Great</title>
<meta name="description" content="A collection of Queso You're Great logos and stickers by Sarah Leach.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,400..900,100,1&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --cream: #f6eedd;
    --ink: #22384f;
    --blue: #2c5b80;
    --sky: #9cc7e6;
    --mustard: #f2b73f;
    --orange: #e9832b;
    --green: #3d5b2e;
    --red: #8e2b22;
    --teal: #2bb3a8;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    background: var(--cream);
    color: var(--ink);
    font: 400 17px/1.55 "DM Sans", system-ui, sans-serif;
  }
  .display {
    font-family: "Fraunces", Georgia, serif;
    font-variation-settings: "opsz" 144, "SOFT" 100, "WONK" 1;
    font-weight: 900;
    letter-spacing: -0.035em;
    line-height: 0.86;
  }

  /* hero */
  .hero {
    background: var(--blue);
    color: var(--mustard);
    min-height: 92vh;
    display: grid;
    place-items: center;
    padding: 64px 16px;
    position: relative;
    overflow: hidden;
  }
  .hero h1 {
    margin: 0;
    font-size: clamp(76px, 17vw, 240px);
    text-align: center;
  }
  .hero h1 span { display: block; }
  .hero h1 span:nth-child(2) { padding-left: .5em; }
  .hero h1 span:nth-child(3) { padding-right: .3em; }
  .hero h1 span:nth-child(1) { animation: rise .9s cubic-bezier(.2,.8,.2,1) both; }
  .hero h1 span:nth-child(2) { animation: rise .9s .12s cubic-bezier(.2,.8,.2,1) both; }
  .hero h1 span:nth-child(3) { animation: rise .9s .24s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(.25em); } }
  .hero .scroll {
    position: absolute;
    bottom: 24px; left: 50%;
    transform: translateX(-50%);
    color: var(--cream);
    font-size: 14px;
    font-weight: 500;
    letter-spacing: .14em;
    text-transform: uppercase;
    text-decoration: none;
  }

  /* sections */
  section.set { padding: 96px 16px 32px; max-width: 1240px; margin: 0 auto; }
  .set header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 16px; margin-bottom: 32px; }
  .set h2 { margin: 0; font-size: clamp(48px, 8vw, 104px); color: var(--orange); }
  .set header p { margin: 0; max-width: 34ch; font-size: 16px; }
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .tile {
    all: unset;
    cursor: zoom-in;
    aspect-ratio: 1;
    border-radius: 20px;
    overflow: hidden;
    display: grid;
    place-items: center;
    background: var(--bg, var(--sky));
    transition: transform .25s cubic-bezier(.2,.8,.2,1);
  }
  .tile:hover { transform: rotate(-1.5deg) scale(1.02); }
  .tile:focus-visible { outline: 3px solid var(--orange); outline-offset: 4px; }
  .tile img { width: 100%; height: 100%; object-fit: contain; padding: 10%; }
  .tile.full img { object-fit: cover; padding: 0; }

  /* lightbox */
  .lightbox {
    position: fixed; inset: 0;
    background: rgba(20, 30, 42, .9);
    display: grid; place-items: center;
    padding: 24px 16px;
    z-index: 10;
    cursor: zoom-out;
  }
  .lightbox img { max-width: min(900px, 100%); max-height: 88vh; border-radius: 16px; }

  footer {
    margin-top: 96px;
    background: var(--mustard);
    color: var(--ink);
    padding: 72px 16px 40px;
    text-align: center;
  }
  footer .display { font-size: clamp(44px, 9vw, 112px); margin: 0 0 24px; }
  footer p { margin: 0; font-size: 15px; }
  footer a { color: inherit; }

  @media (prefers-reduced-motion: reduce) {
    .hero h1 span { animation: none !important; }
    .tile { transition: none; }
  }
</style>
</head>
<body>

<div class="hero">
  <h1 class="display"><span>Queso</span><span>you're</span><span>great</span></h1>
  <a class="scroll" href="#logos">See the logos ↓</a>
</div>

<section class="set" id="logos">
  <header>
    <h2 class="display">The logos</h2>
    <p>Every version of the wordmark so far.</p>
  </header>
  <div class="grid">
    <button class="tile full" style="--bg:var(--orange)"><img src="img/queso2026-02.png" alt="Queso You're Great in orange retro script on blue"></button>
    <button class="tile full" style="--bg:var(--sky)"><img src="img/queso2026-03.png" alt="Queso You're Great in rounded lowercase on light blue"></button>
    <button class="tile full" style="--bg:var(--green)"><img src="img/queso2026-04.png" alt="Queso You're Great in orange monoline script on green"></button>
    <button class="tile full" style="--bg:var(--teal)"><img src="img/queso2026-05.png" alt="Queso You're Great in tall capitals on teal"></button>
    <button class="tile full" style="--bg:var(--blue)"><img src="img/queso2026-06.png" alt="Queso You're Great in orange script on bright blue"></button>
    <button class="tile full" style="--bg:var(--red)"><img src="img/queso2026-07.png" alt="Queso You're Great in chunky serif on deep red"></button>
    <button class="tile" style="--bg:var(--mustard)"><img src="img/chip-07.png" alt="Queso You're Great in navy script with a yellow drop shadow"></button>
    <button class="tile" style="--bg:var(--sky)"><img src="img/chip-10.png" alt="Queso You're Great in navy monoline script"></button>
    <button class="tile" style="--bg:var(--orange)"><img src="img/chip-06.png" alt="Queso You're Great in navy chunky serif"></button>
    <button class="tile" style="--bg:var(--mustard)"><img src="img/chip-08.png" alt="Queso You're Great in navy and yellow rounded lowercase"></button>
    <button class="tile" style="--bg:var(--blue)"><img src="img/chip-09.png" alt="Queso You're Great in navy retro script"></button>
    <button class="tile" style="--bg:var(--red)"><img src="img/chip-11.png" alt="Queso You're Great in yellow tall capitals"></button>
  </div>
</section>

<section class="set" id="chip">
  <header>
    <h2 class="display">Chill chip</h2>
    <p>A tortilla chip taking a well-earned queso bath.</p>
  </header>
  <div class="grid">
    <button class="tile full" style="--bg:var(--cream)"><img src="img/chip-01.png" alt="A sleepy tortilla chip relaxing in a bowl of queso"></button>
    <button class="tile" style="--bg:var(--green)"><img src="img/chip-03.png" alt="The chill chip in a floral bowl"></button>
    <button class="tile" style="--bg:var(--blue)"><img src="img/chip-12.png" alt="Queso You're Great sticker with the chill chip in yellow"></button>
    <button class="tile" style="--bg:var(--mustard)"><img src="img/chip-13.png" alt="Queso You're Great sticker with the chill chip in navy"></button>
    <button class="tile" style="--bg:var(--sky)"><img src="img/sticker-round.png" alt="Round Queso You're Great sticker with a cheerful chip in a red bowl"></button>
    <button class="tile" style="--bg:var(--teal)"><img src="img/bowl-guy.png" alt="A smiling chip lounging in a bowl of queso"></button>
  </div>
</section>

<footer>
  <p class="display">Queso you're great.</p>
  <p>Designed by <a href="https://sarahleach.design">Sarah Leach</a></p>
</footer>

<div class="lightbox" hidden><img alt=""></div>

<script>
  const box = document.querySelector('.lightbox');
  const big = box.querySelector('img');
  document.querySelectorAll('.tile').forEach(t => t.addEventListener('click', () => {
    const img = t.querySelector('img');
    big.src = img.src; big.alt = img.alt;
    box.style.background = '';
    box.hidden = false;
  }));
  box.addEventListener('click', () => box.hidden = true);
  document.addEventListener('keydown', e => { if (e.key === 'Escape') box.hidden = true; });
</script>
</body>
</html>
